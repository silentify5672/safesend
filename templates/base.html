<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SafeSend{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="{{ url_for('home') }}"><span class="logo-mark">✓</span> SafeSend</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{% if request.endpoint in ('home', 'pay', 'status') %}active{% endif %}">Send money</a>
      <a href="{{ url_for('contact') }}" class="{% if request.endpoint == 'contact' %}active{% endif %}">Trusted contact</a>
      <a href="{{ url_for('settings_page') }}" class="{% if request.endpoint == 'settings_page' %}active{% endif %}">Settings</a>
    </nav>
  </header>
  <div class="sandbox-note">Demo using PayPal sandbox: pretend money only.</div>

  <main class="{% block main_class %}{% endblock %}">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
